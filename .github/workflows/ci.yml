name: CI

# What runs when:
#
#   draft pull request    →  this workflow, static gates only
#   ready for review      →  this workflow: every gate, then a preview deploy
#   merge to main         →  this workflow: every gate, then the deploys
#                            ...then the "Version packages" PR, if changesets
#                            are pending
#   a human clicks it     →  publish.yml, which is the only thing that reaches
#                            npm
#
# Three separate workflows used to start on every push — CI, CodeQL and
# Release — and two of them ran the same nine gates against the same commit.
# The gate set now lives in `verify.yml` and is called from here and from
# `publish.yml`, so it is defined once and runs once per commit.

on:
  push:
    branches: [main]
  # Changes reach main through pull requests only; branch protection refuses
  # a direct push. The push trigger above is what runs on the merge commit.
  #
  # `ready_for_review` is not in the default set of types. Without it, marking
  # a draft ready would re-run nothing, and the full gates would wait for the
  # next push. `converted_to_draft` is left out on purpose: it changes no code,
  # and the next push runs the draft tier anyway.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, never a run that is mid-deploy on main. Two
  # merges in quick succession used to cancel the first one's `vercel deploy`.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege. There was no permissions block, so every job inherited the
# repository default while running `pnpm dlx` on network-fetched code. Jobs that
# need more than read declare it themselves.
permissions:
  contents: read

# Identifiers, not credentials — they appear in .vercel/project.json on every
# machine that has ever run `vercel link`. The only secret is VERCEL_TOKEN.
env:
  VERCEL_ORG_ID: team_ykOxK7PvNXML8d1afzA5dfNP
  VERCEL_PROJECT_ID_DOCS: prj_mdPnSKVCxN5nwG1XZrHDBrBHYOQq

jobs:
  # Every gate, in one place, shared with publish.yml. A reusable workflow's
  # jobs run inside this run — no second entry in the Actions list, and no
  # second copy of the list to keep in step.
  #
  # A draft gets the fast tier, the same static gates `pnpm verify --fast` runs
  # before every push. It takes minutes, and it does not keep a 16-core runner
  # busy with coverage and three browser engines for work nobody is reviewing
  # yet. Every other event gets the full set: a ready pull request, the merge
  # commit on main, and each push to a ready pull request.
  gates:
    name: Verify
    uses: ./.github/workflows/verify.yml
    with:
      tier: ${{ github.event.pull_request.draft && 'fast' || 'full' }}
    permissions:
      contents: read

  # ---------------------------------------------------------------------------
  # Deployment
  #
  # `needs: [gates]` is what makes a green build a precondition rather than a
  # parallel opinion. It also removes the failure mode this replaced: deploys
  # ran from a laptop via `vercel --prod`, against whatever branch happened to
  # be checked out, and production sat three merges stale because the working
  # copy was on a feature branch. CI has no checkout to get wrong.
  # ---------------------------------------------------------------------------
  deploy-docs:
    name: Deploy docs (production)
    runs-on: ubuntu-latest
    needs: [gates]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    environment:
      name: production
      url: https://zoblocks.design

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Neither the workspace install nor the Turbo cache: `vercel build` does
      # its own install and its own build, in its own output directory, and
      # never reads either. Restoring a 200MB cache it will not look at is
      # latency for nothing.
      - uses: ./.github/actions/setup
        with:
          install: "false"
          turbo-cache: "false"

      - name: Deploy
        id: deploy
        uses: ./.github/actions/vercel-deploy
        with:
          project-id: ${{ env.VERCEL_PROJECT_ID_DOCS }}
          token: ${{ secrets.VERCEL_TOKEN }}
          production: "true"

      # Through the environment, not interpolated into the script body. The URL
      # comes back from a network call, and `${{ }}` is expanded before the
      # shell parses the line.
      - name: Summarise
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "### Docs deployed"
            echo "$URL"
          } >> "$GITHUB_STEP_SUMMARY"

      # The registry is the contract customers install against. A deploy that
      # returns 200 but serves a stale or malformed registry is a broken
      # install for everyone, and it is exactly what went unnoticed for three
      # merges. Assert the deployed artifact, not just the response code.
      #
      # Verified against what this commit actually built, rather than against a
      # component named here. The previous version fetched `vitals-panel.json`
      # by name; when that component was removed the gate kept asking for it, so
      # the next merge to main would have failed on a component that was
      # deliberately deleted. A gate must not carry its own expiry date.
      - name: Verify the deployed registry
        run: |
          set -euo pipefail
          expected=$(node -e 'process.stdout.write(require("./registry.json").items.map(i=>i.name).sort().join(","))')
          echo "Expecting: $expected"

          url="https://zoblocks.design/r/index.json?ci=${GITHUB_SHA}"
          # `_` rather than `i`: the counter bounds the loop and is never
          # read, and shellcheck is right to say so.
          for _ in $(seq 1 10); do
            body=$(curl -fsS --max-time 20 "$url" || true)
            if [ -n "$body" ]; then break; fi
            sleep 6
          done

          if [ -z "$body" ]; then
            echo "::error::Deployed registry index was unreachable after 10 attempts."
            exit 1
          fi

          echo "$body" | EXPECTED="$expected" node -e '
            const served = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const names = (served.items ?? []).map((i) => i.name).sort().join(",");
            if (names !== process.env.EXPECTED) {
              console.error("::error::Deployed registry does not match this build.");
              console.error("  built:  " + process.env.EXPECTED);
              console.error("  served: " + names);
              process.exit(1);
            }
            console.log("Registry verified: " + (served.items ?? []).length + " items served");
          '

      # What coding agents read: the catalog manifest `@zoblocks/mcp` fetches,
      # the skill bundle served at /ai/skill.json, and the /mcp endpoint
      # `zoblocks mcp init` configures. A handshake, the seven read-only tools, a real
      # answer, and a 403 for a foreign Origin — against this deploy, checked
      # against this checkout's registry and schema version. Plain Node: this
      # job installs nothing.
      - name: Verify the deployed agent endpoints
        run: node scripts/check-agent-endpoints.mjs --base https://zoblocks.design

  # hq is a separate Vercel project. The job self-skips until VERCEL_PROJECT_ID_HQ
  # exists as a repository variable, so this workflow is committable before the
  # project is created rather than red until someone gets to it.
  #
  # The skip is a JOB condition, not a per-step one.
  #
  # It used to be five steps each guarded by `steps.gate.outputs.skip`, and no
  # step declared `id: gate` — so the expression read an empty string, every
  # guarded step skipped, and GitHub reported the job as *successful* because a
  # job whose steps all skip is a job that passed. hq was never deployed and
  # the pipeline said it was, including the post-deploy assertion that would
  # have noticed.
  #
  # At job level GitHub reports the job as *skipped*, which is honest by
  # construction and cannot be misread as a deploy. `actionlint` in the lint
  # gate now catches the original mistake — an unresolvable `steps.*` reference
  # is a static error, and it flagged all five the first time it ran.
  deploy-hq:
    name: Deploy hq (production)
    needs: [gates]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.VERCEL_PROJECT_ID_HQ != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-hq
      url: https://hq.zoblocks.design

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          install: "false"
          turbo-cache: "false"

      - name: Deploy
        uses: ./.github/actions/vercel-deploy
        with:
          project-id: ${{ vars.VERCEL_PROJECT_ID_HQ }}
          token: ${{ secrets.VERCEL_TOKEN }}
          production: "true"

      # Asserted against the custom domain only when it is actually attached.
      # It was hard-coded, so a successful deploy failed here with curl exit 6 —
      # host not found — reported as though hq were broken when hq was fine and
      # the domain simply had not been moved onto the project yet. A check that
      # fails for a reason outside what it is checking teaches people to ignore
      # it.
      - name: Verify hq is serving hq
        run: |
          set -uo pipefail
          host=hq.zoblocks.design

          if ! getent hosts "$host" >/dev/null 2>&1 && ! host "$host" >/dev/null 2>&1; then
            echo "$host does not resolve yet — domain not attached to this project. Skipping the check." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Signed out, hq must redirect to its own sign-in rather than render.
          # A wrong Root Directory would serve the marketing site from this
          # hostname, and the redirect is what distinguishes them.
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://$host/tasks")
          if [ "$code" != "307" ] && [ "$code" != "302" ]; then
            echo "::error::https://$host/tasks returned $code, expected a redirect to sign-in. Check the project Root Directory is apps/hq."
            exit 1
          fi
          echo "hq responded $code — signed-out redirect intact."

  # The console — sign-in, the marketplace catalogue, checkout and delivery.
  #
  # It has never been deployed. `app.zoblocks.design` has no DNS record, which
  # is why /login is unreachable and why the public marketplace fetched an
  # empty catalogue from the day it shipped: every one of those symptoms is
  # this missing job.
  #
  # Self-skipping on VERCEL_PROJECT_ID_APP, exactly as deploy-hq does, so this
  # is committable before the Vercel project exists rather than red until
  # somebody creates it. Three things are needed to switch it on, and none of
  # them can be done from here:
  #
  #   1. A Vercel project with Root Directory `apps/app`, and its id set as the
  #      repository variable VERCEL_PROJECT_ID_APP.
  #   2. `app.zoblocks.design` attached to that project.
  #   3. Its runtime environment: DATABASE_URL for a production MongoDB, and
  #      the Stripe keys if checkout is to complete. Without the database the
  #      deploy succeeds and every request 500s.
  deploy-app:
    name: Deploy app (production)
    needs: [gates]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.VERCEL_PROJECT_ID_APP != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-app
      url: https://app.zoblocks.design

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          install: "false"
          turbo-cache: "false"

      - name: Deploy
        uses: ./.github/actions/vercel-deploy
        with:
          project-id: ${{ vars.VERCEL_PROJECT_ID_APP }}
          token: ${{ secrets.VERCEL_TOKEN }}
          production: "true"

      # The catalogue is the one endpoint the public site depends on, so it is
      # the one worth asserting. Skipped until the domain is attached, for the
      # same reason hq's check is: a failure for a reason outside what is being
      # checked teaches people to ignore the check.
      - name: Verify the console is serving its catalogue
        run: |
          set -uo pipefail
          host=app.zoblocks.design

          if ! getent hosts "$host" >/dev/null 2>&1 && ! host "$host" >/dev/null 2>&1; then
            echo "$host does not resolve yet — domain not attached to this project. Skipping the check." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://$host/c/catalog.json")
          if [ "$code" != "200" ]; then
            echo "::error::https://$host/c/catalog.json returned $code. The public marketplace falls back to its local catalogue while this is broken."
            exit 1
          fi
          echo "Catalogue responded 200 — the public marketplace will read it rather than its fallback."

  # Preview per pull request. Same build path as production, so a PR that
  # deploys is a PR that can be looked at rather than imagined.
  deploy-preview:
    name: Deploy docs (preview)
    needs: [gates]
    # Ready pull requests only. A preview is for review, and a draft is not
    # there yet. It also keeps drafts to the one short job.
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          install: "false"
          turbo-cache: "false"

      - name: Deploy preview
        id: deploy
        uses: ./.github/actions/vercel-deploy
        with:
          project-id: ${{ env.VERCEL_PROJECT_ID_DOCS }}
          token: ${{ secrets.VERCEL_TOKEN }}
          # Fork PRs never receive secrets, so a tokenless run is the normal
          # path for an outside contribution. Say so plainly instead of
          # reporting a green "deployed" that deployed nothing.
          tolerate-missing-token: "true"

      - name: Summarise
        if: steps.deploy.outputs.skipped != 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "### Preview"
            echo "$URL"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Versioning — and only versioning.
  #
  # This was `release.yml`, a third workflow that started on every push and
  # re-ran nine of the gates above before doing anything. It is a job here
  # instead, for two reasons beyond the duplicated compute: a separate workflow
  # had no `needs:` on CI, so a commit with red CI could open a version PR and
  # publish from it; and it was a third entry in the Actions list for every
  # merge.
  #
  # Publishing has moved out entirely, to `publish.yml`, which nothing triggers
  # automatically. Merging the "Version packages" PR no longer ships anything —
  # a human clicks Run workflow when they have decided to. The site can ship
  # many times a day; an npm release changes what every existing consumer
  # resolves to, and should happen when someone decided it would.
  # ---------------------------------------------------------------------------
  version:
    name: Version packages
    needs: [gates]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Serialised across runs, and never cancelled: two merges in quick
    # succession must not race each other to force-push the version branch.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write

    # Git hooks are for humans.
    #
    # `prepare: husky` installs them on every `pnpm install`, including here, so
    # a commit made by this job runs `lint-staged` and `commitlint` — checks
    # written for hand-authored commits, re-running work the pipeline has
    # already done. The Version commit is generated by changesets and its
    # message is fixed by that convention, so commitlint rejected it outright:
    #
    #     subject may not be empty [subject-empty]
    #     type may not be empty [type-empty]
    #     husky - commit-msg script failed (code 1)
    #
    # HUSKY=0 stops them installing at all. Nothing is lost: every gate those
    # hooks run is a gate `gates` has already run, against the whole repository
    # rather than against staged files.
    env:
      HUSKY: 0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # `changeset version` edits manifests and changelogs; it builds nothing,
      # so there is no Turbo cache worth restoring.
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"

      # `RELEASE_PAT` is optional and exists for one reason: opening the
      # "Version packages" PR needs a permission the workflow cannot grant
      # itself. The `pull-requests: write` above is necessary and not
      # sufficient — a repository switch, Settings -> Actions -> General ->
      # Workflow permissions -> "Allow GitHub Actions to create and approve
      # pull requests", overrides it. While that is off, the action versions
      # every package correctly and then fails on the final call with
      # "GitHub Actions is not permitted to create or approve pull requests".
      #
      # Enabling the switch is the simpler fix and stores no credential. The
      # PAT is for a repository that keeps the switch off on purpose: a token
      # belonging to a person rather than to the run.
      #
      # No `publish-script`. Without one the action versions and opens the PR
      # and stops there, which is the whole point of this job now.
      #
      # Worth noting for next time: the inputs below were renamed by
      # changesets/action and it hard-errors on the old spellings rather than
      # falling back, so this step failed on every merge for a while. The rename
      # shipped inside the `v2` tag we pin to, so pinning a major is not the
      # protection it looks like. A digest pin would have held.
      - name: Open or update the Version PR
        id: changesets
        # Allowed to fail so the fallback below can run. The fallback re-fails
        # the job for anything that is not the PR-permission case.
        continue-on-error: true
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2 branch head
        with:
          # Not bare `changeset version`: the MCP Registry listing
          # (packages/mcp/server.json) carries the version too.
          version-script: pnpm version-packages
          commit-message: "Version packages"
          pr-title: "Version packages"
          github-token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      # Opening the pull request is the one thing this job cannot do for
      # itself when that repository switch is off. Pushing a branch needs only
      # `contents: write`, which this job has. So the branch is pushed and the
      # summary carries a one-click link to open the PR from it.
      - name: Push the Version branch when Actions may not open the PR
        if: steps.changesets.outcome == 'failure'
        env:
          BRANCH: changeset-release/main
        run: |
          set -euo pipefail

          # Read from the commit, never from the working tree. `changeset
          # version` deletes each changeset as it consumes it, and it does that
          # *before* the call that opens the pull request — so by the time this
          # step runs the directory is empty whether or not there was anything
          # to release. Checking the tree reported "no changesets pending" on a
          # run with sixteen of them, and turned a recoverable state into a red
          # build carrying a message that pointed at the wrong thing entirely.
          #
          # `git ls-tree` reads the immutable commit, so nothing the previous
          # step did can change the answer.
          pending=$(git ls-tree -r --name-only "$GITHUB_SHA" -- .changeset \
            | grep -viE 'config\.json|README\.md' | head -1)
          if [ -z "$pending" ]; then
            echo "::error::The versioning step failed and this commit carries no changesets, so it had nothing to version. Read the log above."
            exit 1
          fi

          # A clean slate. The action may have versioned and committed before
          # it failed, and running `changeset version` over that would double
          # every bump.
          git reset --hard "$GITHUB_SHA"
          git switch -C "$BRANCH"

          pnpm changeset version

          git add -A
          # --no-verify as well as HUSKY=0: this commit is machine-generated
          # from changesets output, and every gate those hooks would run has
          # already run against the whole repository in `gates`.
          #
          # The message is conventional so the history stays readable, and so
          # this does not depend on hooks being off in order to be valid.
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --no-verify -m "chore(release): version packages"
          git push --force origin "$BRANCH"

          compare="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
          {
            echo "### The Version PR is ready to open"
            echo
            echo "GitHub Actions is not permitted to open pull requests in this"
            echo "repository, so the versioned branch has been pushed instead."
            echo
            echo "**[Open the Version PR](${compare})** — review the bumps and the"
            echo "changelogs, then merge it. Merging publishes nothing: run the"
            echo "**Publish to npm** workflow when you are ready to ship."
            echo
            echo "To have it opened automatically in future, either tick *Settings ->"
            echo "Actions -> General -> Workflow permissions -> Allow GitHub Actions to"
            echo "create and approve pull requests*, or add a \`RELEASE_PAT\` secret with"
            echo "\`repo\` scope — this workflow already prefers the PAT when present."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice::Version branch pushed. Open the PR: ${compare}"
